<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>BC Atlaižu Helperis</title>
  <style>
    :root {
      --primary: #ff5501;
      --primary-hover: #e04b00;
      --dark: #1e293b;
      --gray-bg: #f8fafc;
      --border: #e2e8f0;
      --text: #334155;
      --text-muted: #64748b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: #ffffff;
      font-size: 13px;
    }

    .header {
      padding: 14px 16px;
      background: var(--dark);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 28px;
      height: 28px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
    }

    .header-version {
      font-size: 11px;
      color: #94a3b8;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-weight: 600;
    }

    .content {
      padding: 14px 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card {
      background: var(--gray-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .client-list {
      list-style: none;
      max-height: 140px;
      overflow-y: auto;
    }

    .client-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #edf2f7;
      font-size: 12.5px;
    }

    .client-item:last-child {
      border-bottom: none;
    }

    .client-code {
      font-weight: 600;
      color: var(--dark);
    }

    .client-count {
      color: var(--text-muted);
      font-size: 11.5px;
    }

    .empty-text {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      padding: 10px 0;
    }

    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
      border: 1px solid transparent;
      margin-bottom: 8px;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: #f1f5f9;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fca5a5;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .footer {
      padding: 10px 16px;
      background: var(--gray-bg);
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title-box">
      <img src="icons/icon48.png" style="width: 32px; height: 32px; border-radius: 8px; object-fit: contain; box-shadow: 0 2px 6px rgba(0,0,0,0.12);" alt="Logo">
      <div>
        <div class="header-title">BC Atlaižu Helperis</div>
        <div class="header-version" id="header-version-text">AM Furnitūra · v1.3.8</div>
      </div>
    </div>
    <div class="status-badge">Aktīvs</div>
  </div>

  <div id="update-banner" style="display: none; margin: 12px 16px 0 16px; padding: 10px 12px; background: #fff8f1; border: 1px solid #fed7aa; border-radius: 8px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <div style="font-size: 12px; color: #9a3412;">
        <strong>🚀 Pieejams jauns laidiens:</strong> <span id="update-version-tag"></span>
      </div>
      <a href="#" id="update-download-btn" target="_blank" style="display: inline-block; font-size: 11px; font-weight: 600; background: #ff5501; color: white; padding: 4px 8px; border-radius: 4px; text-decoration: none;">Atvērt</a>
    </div>
  </div>

  <div class="content">
    <div class="section-title">Saglabātie klienti un atlaides</div>
    <div class="card">
      <ul class="client-list" id="client-list">
        <li class="empty-text">Ielādē datus...</li>
      </ul>
    </div>

    <div class="section-title">Pasūtījuma darbības</div>
    <button class="btn btn-primary" id="open-modal-in-page-btn" style="padding: 10px 14px; font-size: 13px; margin-bottom: 14px;">
      <span>⚡</span> Atvērt atlaižu pārvaldnieku pasūtījumā
    </button>

    <div class="section-title">Ātrās darbības</div>
    <button class="btn btn-secondary" id="open-page7004-btn">
      <span>🔍</span> Atvērt Page 7004 (Sales Line Discounts)
    </button>
    <button class="btn btn-danger" id="clear-cache-btn">
      <span>🗑️</span> Notīrīt atlaižu kešatmiņu
    </button>

    <div class="section-title" style="margin-top: 14px;">Atjauninājumi & Versija</div>
    <div class="card" style="padding: 10px 12px; margin-bottom: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <div>
          <div style="font-size: 12px; font-weight: 600; color: var(--dark);" id="version-current-label">Versija: v1.3.8</div>
          <div style="font-size: 10px; color: var(--text-muted); margin-top: 2px;" id="version-last-checked-label">Pēdējā pārbaude: —</div>
        </div>
        <button class="btn btn-secondary" id="check-updates-btn" style="width: auto; padding: 5px 10px; font-size: 11px; margin: 0; white-space: nowrap;">
          🔄 Pārbaudīt tagad
        </button>
      </div>
      <div id="version-check-status" style="margin-top: 8px; font-size: 11px; display: none;"></div>
    </div>
  </div>

  <div class="footer">
    Atveriet pasūtījumu (Page 42) un spiediet oranžo pogu apakšā pa labi.
  </div>

  <script src="popup.js"></script>
</body>
</html>
